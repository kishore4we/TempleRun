name: Build Android APK

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create React Native project
        run: |
          npx @react-native-community/cli@latest init TempleRunBuild --template react-native-template-typescript --skip-install

      - name: Copy game source code
        run: |
          cp -r mobile/src TempleRunBuild/
          cp mobile/tsconfig.json TempleRunBuild/
          cp mobile/babel.config.js TempleRunBuild/
          cp mobile/metro.config.js TempleRunBuild/
          cp mobile/index.js TempleRunBuild/

      - name: Update package.json
        run: |
          cd TempleRunBuild
          npm install --save \
            @react-navigation/native@^6.1.9 \
            @react-navigation/stack@^6.3.20 \
            @reduxjs/toolkit@^1.9.7 \
            react-redux@^8.1.3 \
            axios@^1.6.0 \
            @react-native-async-storage/async-storage@^1.19.5 \
            react-native-gesture-handler@^2.13.4 \
            react-native-reanimated@^3.5.4 \
            react-native-safe-area-context@^4.7.4 \
            react-native-screens@^3.27.0

      - name: Build Android Release
        run: |
          cd TempleRunBuild/android
          ./gradlew assembleRelease

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Temple Run ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Temple Run - Android Release

            ### Features
            - 🎮 Endless runner gameplay
            - 🏃 Swipe controls (left, right, up, down)
            - 🪙 Coin collection system
            - 🚧 Obstacle avoidance
            - 📊 Real-time score tracking
            - 🏆 Global leaderboards
            - 👤 User authentication
            - 📈 Statistics tracking

            ### Installation
            1. Download `temple-run.apk` below
            2. Enable "Install from Unknown Sources" on your Android device
            3. Install the APK
            4. Enjoy! 🎉

            ### Requirements
            - Android 5.0 (API 21) or higher
            - 100 MB free storage
            - Internet connection for online features

            ### Backend Setup
            This app connects to the Temple Run backend API. Make sure the backend is running or deployed.

            Default API: `http://localhost:3000/api/v1`

            See README.md for backend setup instructions.
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./TempleRunBuild/android/app/build/outputs/apk/release/app-release.apk
          asset_name: temple-run.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: temple-run-apk
          path: ./TempleRunBuild/android/app/build/outputs/apk/release/app-release.apk
