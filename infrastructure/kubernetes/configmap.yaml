apiVersion: v1
kind: ConfigMap
metadata:
  name: templerun-config
data:
  db_host: "postgres-service"
  db_port: "5432"
  db_name: "templerun"
  redis_host: "redis-service"
  redis_port: "6379"
  api_version: "v1"
  rate_limit_window_ms: "60000"
  rate_limit_max_requests: "100"
  cors_origin: "*"
  log_level: "info"
